log_format jansetu_diagnostics '$request_id [$time_iso8601] "$request" '
    'status=$status upstream_status=$upstream_status '
    'request_time=$request_time upstream_connect_time=$upstream_connect_time '
    'upstream_response_time=$upstream_response_time upstream_addr=$upstream_addr';
access_log /var/log/nginx/access.log jansetu_diagnostics;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 20m;
    sendfile on;
    keepalive_timeout 10s;

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        add_header X-Request-ID $request_id always;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_send_timeout 30s;
        proxy_next_upstream off;
        proxy_buffering on;
    }

    location = /health {
        proxy_pass http://backend:8080/health;
        proxy_set_header X-Request-ID $request_id;
        add_header X-Request-ID $request_id always;
    }

    location ~* \.(?:css|js|mjs|png|jpg|jpeg|gif|svg|ico|webp|woff2|mp4)$ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}