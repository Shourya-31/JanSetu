version: '3.8'

services:
  # 1. PostgreSQL 16 Database with Optimized Hardware Tuning
  postgres:
    image: postgres:16-alpine
    container_name: jansetu-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jansetu_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jansetu_secure_pass_2026}
      POSTGRES_DB: ${POSTGRES_DB:-jansetu}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    command: >
      postgres
      -c max_connections=300
      -c shared_buffers=512MB
      -c effective_cache_size=1536MB
      -c maintenance_work_mem=128MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c default_statistics_target=100
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c work_mem=16MB
      -c max_worker_processes=6
      -c max_parallel_workers_per_gather=4
      -c max_parallel_workers=6
      -c synchronous_commit=off
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jansetu_user} -d ${POSTGRES_DB:-jansetu}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Fastify Node.js Backend Cluster Engine
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jansetu-backend
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      DATABASE_URL: postgres://${POSTGRES_USER:-jansetu_user}:${POSTGRES_PASSWORD:-jansetu_secure_pass_2026}@postgres:5432/${POSTGRES_DB:-jansetu}
      JWT_SECRET: ${JWT_SECRET:-jansetu_dmft_super_secret_key_2026}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # 3. Frontend React 19 SPA + Nginx Reverse Proxy
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: jansetu-frontend
    restart: always
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend

volumes:
  postgres_data:
    driver: local
